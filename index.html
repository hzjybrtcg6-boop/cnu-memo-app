<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f8f6f1" />
  <title>나만의 일기장</title>
  <style>
    :root{--ink:#252522;--muted:#797870;--line:#dedbd2;--paper:#f8f6f1;--card:#fff;--accent:#2d6655;--accent2:#e8f0ec;--danger:#a04343;--shadow:0 12px 35px rgba(44,40,30,.08)}
    *{box-sizing:border-box} body{margin:0;font-family:Pretendard,"Noto Sans KR",system-ui,-apple-system,sans-serif;background:var(--paper);color:var(--ink)}
    button,input,textarea{font:inherit} button{cursor:pointer} .hidden{display:none!important}
    .login{min-height:100dvh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 20% 10%,#fff 0,transparent 35%),linear-gradient(145deg,#f8f6f1,#eeeae0)}
    .login-card{width:min(430px,100%);background:rgba(255,255,255,.92);padding:46px 34px 34px;border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);text-align:center}
    .mark{width:62px;height:62px;margin:auto;border-radius:20px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:29px;box-shadow:0 9px 24px rgba(45,102,85,.25)}
    h1{font-family:Georgia,"Noto Serif KR",serif;font-size:32px;margin:20px 0 8px}.sub{color:var(--muted);margin:0 0 28px;line-height:1.65}
    .field{text-align:left}.field label{display:block;font-size:13px;font-weight:700;margin:0 0 8px}.password-wrap{position:relative}.password-wrap input{width:100%;height:52px;border:1px solid var(--line);border-radius:14px;padding:0 48px 0 16px;background:#fbfaf7;outline:none}.password-wrap input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(45,102,85,.11)}
    .eye{position:absolute;right:9px;top:8px;border:0;background:transparent;width:36px;height:36px;color:var(--muted)}.primary{width:100%;height:52px;border:0;border-radius:14px;background:var(--accent);color:#fff;font-weight:800;margin-top:14px}.primary:hover{filter:brightness(.94)}.error{min-height:22px;color:var(--danger);font-size:13px;margin:10px 0 0}
    .app{min-height:100dvh;display:grid;grid-template-columns:300px 1fr}.sidebar{height:100dvh;position:sticky;top:0;border-right:1px solid var(--line);background:#f0ede5;padding:24px 18px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:12px;padding:4px 5px 22px;font:700 22px Georgia,"Noto Serif KR",serif}.brand .mark{width:38px;height:38px;border-radius:12px;font-size:18px;margin:0}.new{height:48px;border:0;border-radius:14px;background:var(--accent);color:#fff;font-weight:800;font-size:15px}.search{margin:16px 0 10px}.search input{width:100%;height:43px;border:1px solid var(--line);border-radius:12px;padding:0 13px;background:#faf9f5;outline:none}.note-list{overflow:auto;display:flex;flex-direction:column;gap:8px;padding:2px 1px}.note-item{position:relative;border:1px solid transparent;background:transparent;border-radius:13px;padding:13px;text-align:left;color:inherit}.note-item:hover{background:#f8f6f1}.note-item.active{background:#fff;border-color:var(--line);box-shadow:0 4px 16px rgba(50,45,35,.05)}.note-item strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:20px}.note-item p{font-size:13px;color:var(--muted);margin:6px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pin{position:absolute;right:10px;top:12px;color:var(--accent)}.sidebar-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}.logout{border:0;background:transparent;color:var(--muted);padding:9px;width:100%;text-align:left}.main{min-width:0;padding:28px 5vw 45px}.editor{max-width:920px;margin:auto}.toolbar{display:flex;align-items:center;gap:9px;margin-bottom:28px}.status{font-size:13px;color:var(--muted);margin-right:auto}.icon-btn{border:1px solid var(--line);background:#fff;border-radius:11px;height:40px;padding:0 13px;color:var(--muted)}.icon-btn:hover{color:var(--ink);border-color:#bbb7ac}.delete:hover{color:var(--danger)}.title{width:100%;font:700 clamp(28px,4vw,45px) Georgia,"Noto Serif KR",serif;border:0;background:transparent;outline:none;color:var(--ink);padding:5px 0 14px;border-bottom:1px solid var(--line)}.content{width:100%;min-height:65dvh;resize:none;border:0;background:transparent;outline:none;padding:23px 0;font-size:17px;line-height:1.85;color:#383733}.empty{min-height:70dvh;display:grid;place-items:center;text-align:center;color:var(--muted)}.empty div{max-width:360px}.empty b{display:block;color:var(--ink);font:700 27px Georgia,"Noto Serif KR",serif;margin:10px}.mobile-head{display:none}
    .toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:#252522;color:#fff;padding:11px 17px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:760px){.app{display:block}.sidebar{position:fixed;z-index:10;left:0;top:0;width:min(330px,88vw);transform:translateX(-105%);transition:.25s;box-shadow:var(--shadow)}.sidebar.open{transform:translateX(0)}.mobile-head{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);background:rgba(248,246,241,.92);position:sticky;top:0;z-index:5;backdrop-filter:blur(12px)}.mobile-head button{border:0;background:transparent;font-size:22px}.mobile-head b{font-family:Georgia,"Noto Serif KR",serif}.main{padding:22px 22px 35px}.toolbar{margin-bottom:15px}.title{font-size:31px}.content{min-height:60dvh}.login-card{padding:38px 24px 28px}}
  </style>
</head>
<body>
  <section id="login" class="login">
    <form id="loginForm" class="login-card">
      <div class="mark">✎</div><h1>나만의 일기장</h1><p class="sub">나의 일상을 오랫동안 기억할 수 있도록</p>
      <div class="field"><label for="password">접속 비밀번호</label><div class="password-wrap"><input id="password" type="password" autocomplete="current-password" placeholder="비밀번호를 입력하세요" required><button type="button" class="eye" id="eye" aria-label="비밀번호 표시">◉</button></div></div>
      <button class="primary" id="loginButton">메모장 열기</button><p class="error" id="loginError"></p>
    </form>
  </section>
  <section id="app" class="app hidden">
    <header class="mobile-head"><button id="menu">☰</button><b>나만의 일기장</b></header>
    <aside id="sidebar" class="sidebar"><div class="brand"><span class="mark">✎</span>나만의 일기장</div><button class="new" id="newNote">＋ 새 메모</button><div class="search"><input id="search" placeholder="메모 검색"></div><div id="noteList" class="note-list"></div><div class="sidebar-foot"><button id="logout" class="logout">↪ 로그아웃</button></div></aside>
    <main class="main"><div id="empty" class="empty"><div><span style="font-size:40px">✎</span><b>첫 메모를 남겨보세요</b><span>왼쪽의 ‘새 메모’ 버튼을 눌러 시작할 수 있어요.</span></div></div><div id="editor" class="editor hidden"><div class="toolbar"><span id="status" class="status">저장됨</span><button id="pin" class="icon-btn">☆ 고정</button><button id="delete" class="icon-btn delete">삭제</button></div><input id="title" class="title" maxlength="100" placeholder="제목 없음"><textarea id="content" class="content" placeholder="자유롭게 기록해보세요..."></textarea></div></main>
  </section><div id="toast" class="toast"></div>
<script>
const API='https://bovcalsngjybjgapwdoy.supabase.co/functions/v1/memo-api';
let token=sessionStorage.getItem('memo_token')||'',notes=[],current=null,timer;
const $=s=>document.querySelector(s), esc=s=>(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function request(path,options={}){const r=await fetch(API+path,{...options,headers:{'Content-Type':'application/json',...(token?{'Authorization':'Bearer '+token}:{}),...(options.headers||{})}});let data={};try{data=await r.json()}catch{}if(!r.ok){if(r.status===401&&path!='/login')logout();throw new Error(data.error||'요청을 처리하지 못했습니다.')}return data}
function showApp(){ $('#login').classList.add('hidden');$('#app').classList.remove('hidden');loadNotes() }
async function loadNotes(){try{notes=(await request('/notes')).notes||[];renderList();if(current){const fresh=notes.find(n=>n.id===current.id);if(fresh)openNote(fresh)}else if(notes[0])openNote(notes[0])}catch(e){toast(e.message)}}
function renderList(){const q=$('#search').value.trim().toLowerCase();const list=notes.filter(n=>(n.title+' '+n.content).toLowerCase().includes(q));$('#noteList').innerHTML=list.map(n=>`<button class="note-item ${current?.id===n.id?'active':''}" data-id="${n.id}">${n.is_pinned?'<span class="pin">●</span>':''}<strong>${esc(n.title)||'제목 없음'}</strong><p>${esc(n.content)||'내용 없음'}</p></button>`).join('');document.querySelectorAll('.note-item').forEach(b=>b.onclick=()=>openNote(notes.find(n=>n.id===b.dataset.id)))}
function openNote(n){current=n;$('#empty').classList.add('hidden');$('#editor').classList.remove('hidden');$('#title').value=n.title||'';$('#content').value=n.content||'';$('#pin').textContent=n.is_pinned?'★ 고정됨':'☆ 고정';$('#sidebar').classList.remove('open');renderList()}
async function createNote(){try{const n=(await request('/notes',{method:'POST',body:JSON.stringify({title:'새 메모',content:''})})).note;notes.unshift(n);openNote(n);$('#title').select();toast('새 메모를 만들었습니다.')}catch(e){toast(e.message)}}
function queueSave(){if(!current)return;$('#status').textContent='저장 중…';clearTimeout(timer);timer=setTimeout(save,650)}
async function save(){const body={title:$('#title').value,content:$('#content').value,is_pinned:current.is_pinned};try{const n=(await request('/notes/'+current.id,{method:'PUT',body:JSON.stringify(body)})).note;notes=notes.map(x=>x.id===n.id?n:x);current=n;$('#status').textContent='저장됨';renderList()}catch(e){$('#status').textContent='저장 실패';toast(e.message)}}
async function togglePin(){if(!current)return;current.is_pinned=!current.is_pinned;$('#pin').textContent=current.is_pinned?'★ 고정됨':'☆ 고정';await save();notes.sort((a,b)=>Number(b.is_pinned)-Number(a.is_pinned)||new Date(b.updated_at)-new Date(a.updated_at));renderList()}
async function remove(){if(!current||!confirm('이 메모를 삭제할까요?'))return;try{await request('/notes/'+current.id,{method:'DELETE'});notes=notes.filter(n=>n.id!==current.id);current=null;$('#editor').classList.add('hidden');$('#empty').classList.remove('hidden');renderList();if(notes[0])openNote(notes[0]);toast('메모를 삭제했습니다.')}catch(e){toast(e.message)}}
function logout(){token='';current=null;sessionStorage.removeItem('memo_token');$('#app').classList.add('hidden');$('#login').classList.remove('hidden');$('#password').value='';$('#loginError').textContent=''}
function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
$('#loginForm').onsubmit=async e=>{e.preventDefault();const b=$('#loginButton');b.disabled=true;b.textContent='확인 중…';$('#loginError').textContent='';try{const d=await request('/login',{method:'POST',body:JSON.stringify({password:$('#password').value})});token=d.token;sessionStorage.setItem('memo_token',token);showApp()}catch(err){$('#loginError').textContent=err.message}finally{b.disabled=false;b.textContent='메모장 열기'}};
$('#eye').onclick=()=>{$('#password').type=$('#password').type==='password'?'text':'password'};$('#newNote').onclick=createNote;$('#title').oninput=queueSave;$('#content').oninput=queueSave;$('#pin').onclick=togglePin;$('#delete').onclick=remove;$('#logout').onclick=logout;$('#search').oninput=renderList;$('#menu').onclick=()=>$('#sidebar').classList.toggle('open');if(token)showApp();
</script></body></html>
